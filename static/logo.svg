  <path d="M100 105 Q125 115 140 125" stroke="#00a859" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M100 130 Q120 140 130 148" stroke="#00a859" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Dấu tích xác nhận nhỏ ở góc dưới phải -->
  <circle cx="152" cy="152" r="22" fill="#0f172a"/>
  <polyline points="142,152 149,160 163,145" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
