  <path d="M100 105 Q75 115 60 125" stroke="#00a859" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M100 130 Q80 140 70 148" stroke="#00a859" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Gân lá phải -->
